name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          check-latest: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Build npm packages
        run: scripts/build-npm.sh "${{ steps.version.outputs.value }}"

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for dir in dist/npm/mcp-gate-*; do
            echo "==> publishing $dir"
            npm publish "$dir" --access public --provenance
          done

      - name: Publish wrapper package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish dist/npm/mcp-gate --access public --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Install:

            ```bash
            npm install -g mcp-gate@${{ steps.version.outputs.value }}
            # or: npx -y mcp-gate@${{ steps.version.outputs.value }} --help
            ```
